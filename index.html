<style>
  /* Loading screen. Inline on purpose: it must work even if a stale styles.css
     comes from cache. "Olá!" in several languages on #181818; when the page is
     ready a circle opens from the center (a growing hole in the mask). */
  @property --hole { syntax: "<length>"; inherits: false; initial-value: 0px; }
  .loader { display: none; }
  /* The root background also paints the reserved scrollbar gutter: dark while loading */
  html.loading { overflow: hidden; background: #181818; }
  html.loading .loader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #181818; }
  .loader-word { font-family: Geist, system-ui, sans-serif; font-weight: 400; font-size: clamp(26px, 2.8vw, 42px); line-height: 1; letter-spacing: -.01em; color: #FFFFFF; transition: opacity .2s ease; }
  /* The word fades out first (.2s); then the hole opens (.3s delay). The mask exists only during the reveal. */
  .loader.reveal .loader-word { opacity: 0; }
  .loader.reveal {
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent calc(var(--hole) - 1px), #000 var(--hole));
    mask: radial-gradient(circle at 50% 50%, transparent calc(var(--hole) - 1px), #000 var(--hole));
    animation: loader-open 1.1s cubic-bezier(.76,0,.24,1) .3s forwards;
  }
  @keyframes loader-open { to { --hole: 150vmax; } }
  @media (prefers-reduced-motion: reduce) {
    .loader.reveal { animation: loader-fade .4s ease forwards; }
    @keyframes loader-fade { to { opacity: 0; } }
  }
</style>
<script>
  // The loading screen only exists when JS runs. Failsafe: if script.js never
  // takes over (e.g. a stale cached copy), drop the screen after 9s anyway.
  document.documentElement.classList.add("loading");
  setTimeout(function () {
    var h = document.documentElement, l = document.getElementById("loader");
    if (h.classList.contains("loading") && !h.classList.contains("revealing")) {
      h.classList.remove("loading");
      if (l) l.remove();
    }
  }, 9000);
</script>
